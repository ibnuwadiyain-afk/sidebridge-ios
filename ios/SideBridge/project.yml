name: SideBridge
options:
  bundleIdPrefix: com.sidebridge
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.2"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ARCHS: arm64
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    DEVELOPMENT_TEAM: ""

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: "0.9.19"
  OpenSSL:
    url: https://github.com/krzyzanowskim/OpenSSL.git
    from: "3.1.5004"

targets:
  SideBridge:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SideBridge
        excludes:
          - "Resources/SideBridge.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidebridge.ios
        INFOPLIST_FILE: SideBridge/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SideBridge/Resources/SideBridge.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: SideBridge/Bridging/SideBridge-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      - target: SideBridgeTunnel
        embed: true
        codeSign: true
      - package: ZIPFoundation
      - package: OpenSSL
        product: OpenSSL

  SideBridgeTunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SideBridgeTunnel
        excludes:
          - "SideBridgeTunnel.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidebridge.ios.tunnel
        INFOPLIST_FILE: SideBridgeTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: SideBridgeTunnel/SideBridgeTunnel.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies: []
